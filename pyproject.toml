[project]
name = "qc-studio"
version = "0.1.0"
description = "Web-based quality control application for neuroimaging data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "streamlit>=1.37",
    "pandas>=1.4",
    "numpy>=1.23",
    "typing-extensions>=3.7",
    "cairosvg>=2.9.0",
    "python-dotenv>=1.0",
    "nibabel>=5.0",
    "plotly>=5.24",
    "requests>=2.32",
    "Pillow>=11.0",
    "pyarrow>=19.0",
]

[project.optional-dependencies]
niivue = ["niivue-streamlit>=0.2.1"]

[project.urls]
Repository = "https://github.com/nipoppy/qc-studio"

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-mock>=3.0",
    "pytest-cov>=5.0",
    "black==24.10.0",
    "flake8==7.3.0",
    "codespell==2.4.2",
    "pre-commit>=4.0,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Needed because this is not actually a Python package
bypass-selection = true

[tool.uv]
package = false

[[tool.uv.index]]
name = "test-pypi"
url = "https://test.pypi.org/simple/"
# For security: avoids dependency-confusion on shared package names
explicit = true

[tool.uv.sources]
niivue-streamlit = { index = "test-pypi" }

[tool.black]
line-length = 150
target-version = ["py310"]
