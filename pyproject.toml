[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qc-studio"
version = "0.1.0"
description = "QC Studio for neuroimaging"
dependencies = [
    "pydantic>=2.0",
    "streamlit>=1.20",
    "pandas>=1.4",
    "numpy>=1.23",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
llava = [
    "transformers>=4.53",
    "torch>=2.0",
    "torchvision>=0.15",
    "qwen-vl-utils",
    "accelerate>=1.9",
]