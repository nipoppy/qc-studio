[pytest]
# Configuration for QC-Studio end-to-end (browser) tests.
# These are separate from ui/tests/, which mock Streamlit and never open a
# browser. Run from the repository root:  pytest e2e/

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# The default browsers are set in conftest.py, not here: --browser is an
# "append" option, so listing them here would make any --browser on the
# command line *add* to them rather than replace them.
addopts = -ra --tb=short

markers =
    smoke: proves the app boots and the harness works
    flow: a complete rater journey through the app
    edge: validation and error handling

testpaths = tests
