[pytest]
# Configuration for QC-Studio end-to-end (browser) tests.
# These are separate from ui/tests/, which mock Streamlit and never open a
# browser. Run from the repository root:  pytest e2e/

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Every test runs once per browser listed here. Chromium and Firefox use
# different engines, so a selector that works in one can fail in the other --
# which is the point: Streamlit's own DOM quirks are what this suite leans on.
addopts = -ra --tb=short --browser chromium --browser firefox

markers =
    smoke: proves the app boots and the harness works
    flow: a complete rater journey through the app
    edge: validation and error handling

testpaths = tests
