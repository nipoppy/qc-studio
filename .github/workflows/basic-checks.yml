name: Basic checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  basic-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt

      - name: Run code format check
        run: black --check --config pyproject.toml ui pipelines

      - name: Run linting check
        run: flake8 --config .flake8 ui pipelines --count --show-source --statistics

      - name: Run codespell check
        run: codespell --config .codespellrc README.md docs ui pipelines

      - name: Run tests
        run: python -m pytest ui/tests -q
