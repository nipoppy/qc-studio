name: Basic checks
on: 
  pull_request:
  push:
    branches:
      - main

jobs:
  basic-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install check tools
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 codespell

      - name: Run code format check
        continue-on-error: true
        run: |
          black --check  --config pyproject.toml ui pipelines

      - name: Run linting check
        continue-on-error: true
        run: |
          flake8 ui pipelines --config .flake8 ui pipelines --count --show-source --statistics

      - name: Run codespell check
        run: |
          codespell --config .codespellrc README.md docs ui pipelines

          



